name: Isolated kernel checks
on:
  push:
    branches: [dssmm, ezfomegade, ezfomega, ezfblue]
  pull_request:
    branches: [dssmm, ezfomegade, ezfomega, ezfblue]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          branch = os.environ['BASE_BRANCH']
          targets = ['ezfomegade', 'ezfomega', 'ezfblue']
          if branch != 'dssmm':
              if branch not in targets:
                  raise SystemExit('Select dssmm or a hardware branch')
              targets = [branch]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'target': targets}) + '\n')
          PY
  kernel:
    needs: select
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install host validation dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc git make python3 python3-unicorn python3-setuptools nodejs
      # Container and checkout UIDs differ; trust only this exact owned checkout.
      - name: Configure checked-out repository ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check hardware identity and PR direction
        env:
          KERNEL_TARGET: ${{ matrix.target }}
          CI_BRANCH: ${{ github.base_ref || github.ref_name }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          python3 tests/test-project-isolation.py
          python3 scripts/project_policy.py --expected-target "$KERNEL_TARGET" --branch "$CI_BRANCH" --base-branch "$PR_BASE" --head-branch "$PR_HEAD"
      - name: Verify selected hardware
        env:
          KERNEL_TARGET: ${{ matrix.target }}
        run: python3 scripts/project.py verify "$KERNEL_TARGET"
